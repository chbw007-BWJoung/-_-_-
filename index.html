<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>노거수회 스터디</title>
<meta name="theme-color" content="#2f5d3a">
<meta name="description" content="2026~2027년 노거수회 수목 스터디 일정">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="노거수 스터디">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1f2a22; --muted:#6b7a6e; --line:#e3ddd0;
  --green:#2f5d3a; --green-2:#e3ecdf; --amber:#b5722a; --amber-2:#f8ead8; --red:#a8473c;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141a16;--card:#1d2520;--ink:#e7ece6;--muted:#93a296;--line:#2c3830;
    --green:#7fb98b;--green-2:#22342a;--amber:#e0a560;--amber-2:#3a2d1c;--red:#e28477;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 12px}
@media (prefers-color-scheme: dark){header{background:#21402a}}
.adm{float:right;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;
  padding:5px 11px;font:inherit;font-size:.8rem;cursor:pointer;margin-top:-2px}
.adm.on{background:#f3c26b;color:#2a2a2a;font-weight:700}
.tag{font-size:.88rem;color:var(--muted)}
.tag.empty{color:var(--amber);font-weight:600}
.adminbar{background:var(--amber-2);color:var(--amber);border-radius:10px;padding:8px 12px;font-size:.82rem;
  margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.adminbar button{border:0;background:transparent;color:var(--amber);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
header h1{margin:0;font-size:1.15rem;letter-spacing:-.01em}
header .sub{font-size:.8rem;opacity:.85}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:0;border-radius:999px;padding:6px 13px;font:inherit;font-size:.85rem;
  background:rgba(255,255,255,.16);color:#fff}
.tabs button.on{background:#fff;color:#2f5d3a;font-weight:700}
main{max-width:720px;margin:0 auto;padding:12px 16px calc(env(safe-area-inset-bottom) + 40px)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
.mode{font-size:.78rem;color:var(--muted);margin:0 2px 10px;display:flex;justify-content:space-between;gap:8px}
.mode b{color:var(--green)}
.next{background:var(--green);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px}
@media (prefers-color-scheme: dark){.next{background:#264a31}}
.next .lbl{font-size:.75rem;opacity:.85;font-weight:600}
.next .t{font-size:1.05rem;font-weight:700;margin:2px 0}
.next .m{font-size:.85rem;opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;
  display:grid;grid-template-columns:44px 1fr;gap:4px 10px}
.card.past{opacity:.55}
.card.cur{border-color:var(--green);box-shadow:0 0 0 2px var(--green-2)}
.no{grid-row:span 2;align-self:start;width:40px;height:40px;border-radius:10px;background:var(--green-2);
  color:var(--green);display:grid;place-items:center;font-weight:800}
.date{font-size:.8rem;color:var(--muted)}
.date .dd{font-weight:600}
.topic{font-weight:600;word-break:keep-all}
.who{grid-column:2;display:flex;align-items:center;gap:8px;margin-top:4px}
.who button{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.88rem;
  border-radius:999px;padding:4px 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.who button.empty{border-style:dashed;border-color:var(--amber);color:var(--amber);background:var(--amber-2)}
.who svg{width:14px;height:14px;opacity:.6}
.empty-msg{text-align:center;color:var(--muted);padding:30px 0}
.info h2{font-size:1rem;margin:18px 0 6px;color:var(--green)}
.info ul{padding-left:18px;margin:0}
.info li{margin:3px 0}
.info p{margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.3rem;color:var(--green)}
.stat span{font-size:.75rem;color:var(--muted)}
/* sheet */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:20;align-items:flex-end;justify-content:center}
.dim.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;
  padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
.sheet h3{margin:0 0 4px;font-size:1rem}
.sheet .s{font-size:.85rem;color:var(--muted);margin-bottom:12px;word-break:keep-all}
.sheet input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;
  background:var(--bg);color:var(--ink);margin-bottom:10px}
.row{display:flex;gap:8px}
.row button{flex:1;padding:12px;border-radius:10px;border:0;font:inherit;font-weight:600;cursor:pointer}
.b1{background:var(--green);color:#fff}
.b2{background:var(--bg);color:var(--ink);border:1px solid var(--line)!important}
.b3{background:transparent;color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);
  background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:.88rem;opacity:0;transition:.25s;z-index:30;pointer-events:none}
.toast.show{opacity:1}
.install{display:none;width:100%;margin-bottom:12px;padding:11px;border-radius:10px;border:1px dashed var(--green);
  background:var(--green-2);color:var(--green);font:inherit;font-weight:600}
</style>
</head>
<body>
<header>
  <button class="adm" id="admBtn" aria-label="관리자">🔒</button>
  <h1>노거수회 수목 스터디</h1>
  <div class="sub">2026~2027 · 격주 화요일 19:30–21:30 · Zoom</div>
  <div class="tabs" id="tabs">
    <button data-f="up" class="on">다가오는</button>
    <button data-f="all">전체</button>
    <button data-f="open">담당 미정</button>
    <button data-f="past">지난 발표</button>
    <button data-f="info">안내</button>
  </div>
</header>

<main>
  <button class="install" id="installBtn">📲 홈 화면에 앱으로 설치</button>
  <div id="list"></div>
</main>

<div class="dim" id="dim">
  <div class="sheet" role="dialog" aria-modal="true">
    <h3 id="shTitle">담당자 수정</h3>
    <div class="s" id="shTopic"></div>
    <input id="shName" placeholder="담당자 이름" maxlength="30" autocomplete="off">
    <div class="row">
      <button class="b3" id="shClear">비우기</button>
      <button class="b2" id="shCancel">취소</button>
      <button class="b1" id="shSave">저장</button>
    </div>
  </div>
</div>
<div class="dim" id="dimLogin">
  <div class="sheet" role="dialog" aria-modal="true">
    <h3>관리자 로그인</h3>
    <div class="s">관리자 비밀번호를 입력하면 담당자를 수정할 수 있습니다. 수정 내용은 모든 회원에게 바로 반영됩니다.</div>
    <input id="lgPin" placeholder="관리자 비밀번호" type="password" autocomplete="current-password">
    <div class="row">
      <button class="b2" id="lgCancel">취소</button>
      <button class="b1" id="lgOk">로그인</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const BASE = [
 [1,"2026-01-20","수목의 동정 요령(계절별, 나이별), 생태적 특성에 대한 이해 · 소철(예시)","강기호"],
 [2,"2026-02-03","은행나무, 주목, 나한송, 비자나무, 개비자나무","이상화"],
 [3,"2026-02-24","소나무속(주요 원예품종 포함)","조선녀"],
 [4,"2026-03-10","전나무속, 가문비나무속(주요 원예품종 포함)","김충섭"],
 [5,"2026-03-24","잎갈나무속, 개잎갈나무속(레바논 삼나무), 솔송나무속","신용철"],
 [6,"2026-04-07","낙우송, 메타세쿼이아, 금송, 아라우카리아, 나한백, 세쿼이아(S. sempervirens)","정병욱"],
 [7,"2026-05-12","측백나무과(측백, 편백, 화백, 서양측백, 향나무, 가이즈까향나무, 노간주나무, 눈측백나무, 주요 원예품종 포함)","주성락"],
 [8,"2026-05-26","가래나무과(호두나무, 가래나무, 굴피나무, 중국굴피나무, 피칸), 소귀나무, 담팔수","김주아"],
 [9,"2026-06-09","버드나무과(버드나무속, 사시나무속)","윤준원"],
 [10,"2026-06-23","자작나무과 1(오리나무속, 자작나무속)","유재구"],
 [11,"2026-07-07","자작나무과 2(서어나무속, 개암나무속, 새우나무)","임희진"],
 [12,"2026-07-21","참나무과 1(밤나무속, 구실잣밤나무속, 너도밤나무속(도입종 포함), 대왕참나무, 루브라참나무 등 도입참나무류)","서용선"],
 [13,"2026-08-04","참나무과 2(참나무속 - 상록성 포함)","이숙희"],
 [14,"2026-08-18","느릅나무과(느티나무속, 느릅나무속, 팽나무속, 푸조나무속)","이정은"],
 [15,"2026-09-01","뽕나무과(닥나무속, 무화과나무속, 뽕나무속, 꾸지뽕나무속), 인도보리수, 고무나무류 등","안인숙"],
 [16,"2026-09-15","목련과(목련속, 백합나무속, 초령목 등) · 도입종 목련류 소개","신현진"],
 [17,"2026-09-29","오미자과, 받침꽃과, 붓순나무과, 계수나무과",""],
 [18,"2026-10-13","녹나무과","우희철"],
 [19,"2026-10-27","미나리아재비과, 매자나무과, 으름덩굴과, 방기과",""],
 [20,"2026-11-10","다래나무과, 차나무과",""],
 [21,"2026-11-24","버즘나무과, 조록나무과, 두충과","김혜경"],
 [22,"2026-12-08","수국과, 돈나무",""],
 [23,"2026-12-22","장미과 1(조팝나무속, 산국수나무속, 국수나무속, 쉬땅나무속, 가침박달속, 섬개야광나무속, 명자나무속, 다정큼나무속)",""],
 [24,"2027-01-05","장미과 2(산딸기속, 장미속, 병아리꽃나무속, 황매화속, 윤노리나무속, 팥배나무속, 마가목속, 채진목속)",""],
 [25,"2027-01-19","장미과 3(벚나무속, 홍가시나무속, 비파나무속, 산사나무속, 배나무속, 사과나무속)","강승협"],
 [26,"2027-02-02","콩과","위화평"],
 [27,"2027-02-16","대극과, 굴거리나무과, 소태나무과, 멀구슬나무과","이숙희"],
 [28,"2027-03-02","운향과, 옻나무과, 무환자나무과, 칠엽수과, 나도밤나무과","안인숙"],
 [29,"2027-03-16","단풍나무과","설명숙"],
 [30,"2027-03-30","감탕나무과, 노박덩굴과","문기열"],
 [31,"2027-04-13","고추나무과, 갈매나무과, 포도과, 회양목","정현주"],
 [32,"2027-04-27","피나무과, 아욱과, 벽오동과, 팥꽃나무과","이연옥"],
 [33,"2027-05-11","보리수나무과, 이나무과, 위성류, 배롱나무, 석류나무, 박쥐나무","송시내"],
 [34,"2027-05-25","층층나무과, 두릅나무과","이정은"],
 [35,"2027-06-08","진달래과",""],
 [36,"2027-06-22","자금우과, 감나무과, 때죽나무과, 노린재나무과",""],
 [37,"2027-07-06","물푸레나무과 1(물푸레나무속, 이팝나무속, 목서속, 올리브나무속, 영춘화속, 향선나무속)","신현진"],
 [38,"2027-07-20","물푸레나무과 2(수수꽃다리속, 개나리속, 쥐똥나무속, 미선나무속)",""],
 [39,"2027-08-03","협죽도과, 꼭두서니과, 마편초과, 백리향, 구기자나무",""],
 [40,"2027-08-17","능소화과, 오동나무, 벼과(대나무류), 백합과(청미래덩굴속)",""],
 [41,"2027-08-31","인동과 1(인동속, 산분꽃나무속, 댕강나무속)",""],
 [42,"2027-09-21","인동과 2(딱총나무속, 백당나무속, 병꽃나무속, 아왜나무속)",""],
 [44,"2027-10-05","국화과, 종려과, 용설란과",""]
];
const API = "/api/assignees";
const PIN_KEY = "ngs_admin_pin";
const DOW = ["일","월","화","수","목","금","토"];
let overrides = {}, server = false, admin = false, filter = "up", q = "", editing = null;

const $ = s => document.querySelector(s);
const ls = {
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2200)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function today(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function pd(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function fmt(s){const d=pd(s);return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()} (${DOW[d.getDay()]})`}
function who(no,base){return Object.prototype.hasOwnProperty.call(overrides,no)?overrides[no]:base}
const PEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

function rows(){
  const t=today();
  return BASE.map(([no,date,topic,base])=>({no,date,topic,name:who(String(no),base),past:pd(date)<t}));
}
function render(){
  const ab=$("#admBtn"); ab.textContent=admin?"관리자 ✓":"🔒"; ab.classList.toggle("on",admin);
  const list=$("#list");
  if(filter==="info"){list.innerHTML=infoHTML();return}
  const all=rows(), next=all.find(r=>!r.past);
  let r=all;
  if(filter==="up") r=all.filter(x=>!x.past);
  if(filter==="past") r=all.filter(x=>x.past).reverse();
  if(filter==="open") r=all.filter(x=>!x.name);
  if(q) r=r.filter(x=>(x.topic+" "+x.name+" "+x.no).includes(q));

  let h=`<input class="search" id="q" placeholder="수목·과명·담당자 검색" value="${esc(q)}">`;
  if(admin) h+=`<div class="adminbar"><span>관리자 모드 · 담당자를 눌러 수정하세요</span><button id="logout">로그아웃</button></div>`;
  if(filter==="up"&&next&&!q){
    const days=Math.round((pd(next.date)-today())/864e5);
    h+=`<div class="next"><div class="lbl">다음 스터디 · ${days===0?"오늘":"D-"+days}</div>
      <div class="t">${next.no}회 · ${esc(next.topic)}</div>
      <div class="m">${fmt(next.date)} 19:30 · 담당 ${next.name?esc(next.name):"미정"}</div></div>`;
  }
  if(!r.length) h+=`<div class="empty-msg">해당하는 회차가 없습니다.</div>`;
  for(const x of r){
    const whoH = admin
      ? `<button class="${x.name?"":"empty"}" data-no="${x.no}">${x.name?esc(x.name):"담당 미정"} ${PEN}</button>`
      : `<span class="tag${x.name?"":" empty"}">담당 · ${x.name?esc(x.name):"미정"}</span>`;
    h+=`<div class="card${x.past?" past":""}${next&&x.no===next.no?" cur":""}">
      <div class="no">${x.no}</div>
      <div class="date"><span class="dd">${fmt(x.date)}</span></div>
      <div class="topic">${esc(x.topic)}</div>
      <div class="who">${whoH}</div></div>`;
  }
  list.innerHTML=h;
  const qi=$("#q"); qi.oninput=e=>{q=e.target.value.trim();const p=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)};
  const lo=$("#logout"); if(lo) lo.onclick=logout;
}
function infoHTML(){
  const all=rows(), done=all.filter(x=>x.past).length, open=all.filter(x=>!x.name).length;
  return `<div class="stats"><div class="stat"><b>${all.length}</b><span>전체 회차</span></div>
    <div class="stat"><b>${done}</b><span>진행 완료</span></div>
    <div class="stat"><b>${open}</b><span>담당 미정</span></div></div>
  <div class="info">
  <h2>목적</h2><p>수목의 동정과 생태 정보는 노거수 보호의 가장 기본이면서도 가장 어려운 분야입니다. 계절과 나이에 따라 달라지는 수목의 모습과 생태를 함께 공부하여, 노거수회가 전문가 집단으로서 나무 보호활동을 제대로 할 수 있도록 회원 역량을 높이고자 합니다.</p>
  <h2>개요</h2><ul>
   <li>참여자: 노거수회 회원 (1명당 1개 회차 선정)</li>
   <li>기간: 2026년 1월 20일부터 격주 진행</li>
   <li>시간: 화요일 저녁 19:30 ~ 21:30</li>
   <li>방식: 온라인(Zoom) · 발표자 정리·설명 후 토론</li>
   <li>신청: 발표할 번호를 정해 강기호 님께 개인톡 (가능한 앞번호부터)</li></ul>
  <h2>발표 내용</h2><ul>
   <li>형태적 구분 (시기별, 크기별)</li>
   <li>생태적 특성 (광, 수분, 토양, 온도 등)</li>
   <li>주요 병해충 등 관리 (이식, 전정 등)</li>
   <li>생활권 수목·실내·온실에서 볼 수 있는 일부 도입종 및 원예종 포함</li></ul>
  <h2>참고자료</h2><ul>
   <li>한국의 조경수목 (김성수, 운문당)</li><li>나무생태도감 (윤충원, 지오북)</li>
   <li>한국속식물지 (홍릉과학출판)</li><li>우리나라 나무도감 (윤주복, 진선북스) 등</li></ul>
  </div>`;
}

/* ---- 관리자 ---- */
async function post(body){
  return fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
}
function openLogin(){
  if(!server){toast("서버가 연결되지 않아 수정할 수 없습니다");return}
  $("#lgPin").value=""; $("#dimLogin").classList.add("show"); setTimeout(()=>$("#lgPin").focus(),50);
}
async function login(){
  const pin=$("#lgPin").value.trim(); if(!pin) return;
  try{
    const r=await post({action:"verify",pin});
    if(r.status===403){toast("비밀번호가 맞지 않습니다");return}
    if(r.status===503){toast("서버에 관리자 비밀번호(EDIT_PIN)가 설정되지 않았습니다");return}
    if(!r.ok) throw 0;
  }catch(e){toast("로그인 실패 · 인터넷 연결을 확인하세요");return}
  ls.set(PIN_KEY,pin); admin=true; $("#dimLogin").classList.remove("show"); render(); toast("관리자로 로그인했습니다");
}
function logout(){ls.del(PIN_KEY);admin=false;render();toast("로그아웃했습니다")}
$("#admBtn").onclick=()=>admin?logout():openLogin();
$("#lgOk").onclick=login;
$("#lgPin").onkeydown=e=>{if(e.key==="Enter")login()};
$("#lgCancel").onclick=()=>$("#dimLogin").classList.remove("show");
$("#dimLogin").onclick=e=>{if(e.target.id==="dimLogin")$("#dimLogin").classList.remove("show")};

/* ---- 편집 ---- */
function openSheet(no){
  const b=BASE.find(x=>x[0]===no); editing=no;
  $("#shTitle").textContent=`${no}회 담당자`;
  $("#shTopic").textContent=`${fmt(b[1])} · ${b[2]}`;
  $("#shName").value=who(String(no),b[3])||"";
  $("#dim").classList.add("show"); setTimeout(()=>$("#shName").focus(),50);
}
function closeSheet(){$("#dim").classList.remove("show");editing=null}
async function save(name){
  const no=String(editing); name=name.trim().slice(0,30);
  try{
    const r=await post({action:"set",no,name,pin:ls.get(PIN_KEY)||""});
    if(r.status===403){closeSheet();logout();toast("비밀번호가 바뀌었습니다. 다시 로그인하세요");return}
    if(!r.ok) throw 0;
    overrides=await r.json();
  }catch(e){toast("저장 실패 · 인터넷 연결을 확인하세요");return}
  closeSheet(); render(); toast(name?`${no}회 담당: ${name} (모두에게 반영됨)`:`${no}회 담당을 비웠습니다`);
}
$("#list").addEventListener("click",e=>{const b=e.target.closest("button[data-no]");if(b&&admin)openSheet(Number(b.dataset.no))});
$("#shSave").onclick=()=>save($("#shName").value);
$("#shClear").onclick=()=>save("");
$("#shCancel").onclick=closeSheet;
$("#dim").onclick=e=>{if(e.target.id==="dim")closeSheet()};
$("#shName").onkeydown=e=>{if(e.key==="Enter")save($("#shName").value)};
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
  filter=b.dataset.f;q="";render();window.scrollTo(0,0)};

/* ---- 최신 담당자 명단 불러오기 (앱을 열거나 다시 볼 때마다) ---- */
const CACHE_KEY="ngs_last_data";
async function load(){
  try{
    const r=await fetch(API,{cache:"no-store"});
    if(r.ok&&(r.headers.get("content-type")||"").includes("json")){
      const d=await r.json(); overrides=d.data||{}; server=true;
      ls.set(CACHE_KEY,JSON.stringify(overrides));
      admin=!!ls.get(PIN_KEY); render(); return;
    }
  }catch(e){}
  try{overrides=JSON.parse(ls.get(CACHE_KEY)||"{}")}catch(e){overrides={}}
  server=false; admin=false; render();
}
render(); load();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
setInterval(()=>{if(!document.hidden&&!editing)load()},60000);

/* ---- 설치 ---- */
let deferred=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("#installBtn").style.display="block"});
$("#installBtn").onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$("#installBtn").style.display="none"};
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
